<!DOCTYPE html>

<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Servicios - Roller Speed</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body>


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           th:href="@{/}">
            Roller Speed
        </a>

    </div>

</nav>


<main class="container py-5">

    <h1 th:text="${titulo}">
        Servicios
    </h1>


    <div class="row">

        <div class="col-md-6 mb-3"
             th:each="servicio : ${servicios}">

            <div class="card">

                <div class="card-body">

                    <span th:text="${servicio}">
                        Servicio
                    </span>

                </div>

            </div>

        </div>

    </div>


    <a th:href="@{/}"
       class="btn btn-primary">

        Volver al inicio

    </a>

</main>


</body>

</html>
