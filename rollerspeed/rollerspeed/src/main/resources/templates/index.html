<!DOCTYPE html>

<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Roller Speed</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           th:href="@{/}">

            Roller Speed

        </a>


        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse"
             id="menu">

            <ul class="navbar-nav ms-auto">


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/mision}">

                        Misión

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/vision}">

                        Visión

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/valores}">

                        Valores

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/servicios}">

                        Servicios

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/eventos}">

                        Eventos

                    </a>

                </li>


            </ul>

        </div>

    </div>

</nav>


<main class="container py-5">

    <div class="text-center">

        <h1 th:text="${titulo}">
            Roller Speed
        </h1>

        <p class="lead"
           th:text="${descripcion}">

            Descripción Roller Speed

        </p>

    </div>

</main>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
