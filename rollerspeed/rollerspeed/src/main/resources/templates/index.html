<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Roller Speed</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" th:href="@{/}">
            Roller Speed
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarPrincipal">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarPrincipal">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/mision}">
                        Misión
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/vision}">
                        Visión
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/valores}">
                        Valores
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/servicios}">
                        Servicios
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/eventos}">
                        Eventos
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<div class="container py-5">

    <h1>Escuela de Patinaje Roller Speed</h1>

    <p>
        Bienvenido al sitio web de Roller Speed.
    </p>

    <p>
        Este producto mínimo viable permite consultar información
        institucional sobre la escuela, sus servicios y eventos.
    </p>

</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
